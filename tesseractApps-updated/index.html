    <!-- Critical CSS inlined for above-the-fold content -->
    <!-- Self-hosted Inter (variable) via inline @font-face — no third-party request -->
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/inter-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/inter-latin-ext-wght-normal.woff2") format("woff2");
        unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Inter";
        font-style: italic;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/inter-latin-wght-italic.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: italic;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/inter-latin-ext-wght-italic.woff2") format("woff2");
        unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Metrics-matched fallback: renders at Inter's exact dimensions so the
         fallback→Inter swap causes no reflow (CLS) and no delayed LCP candidate
         for text. Tuned to Inter via size-adjust/ascent/descent overrides. */
      @font-face {
        font-family: "Inter Fallback";
        src: local("Arial");
        ascent-override: 90.44%;
        descent-override: 22.52%;
        line-gap-override: 0%;
        size-adjust: 108.3%;
      }
      :root {
        font-family: "Inter", "Inter Fallback", sans-serif;
        overflow-x: hidden;
        max-width: 1920px;
        --cd-bar-height: 36px;
        --color-primary: #0c78ba;
        --color-primary-rgb: 12, 120, 186;
        --color-secondary: #002a52;
        --color-alt-secondary: #243b8c;
        --color-background-gradient: linear-gradient(to right, #f5fdfe, #f0f7fe);
        --color-text-gray: #555555;
        --color-text-gray2: #4d525f;
        --color-text-gray-light: #4d4d4d;
        --color-text-dark-gray: #343434;
        --color-background-light-gray: #eaeaea;
        --color-background-light-gray2: rgb(236, 236, 236);
        --color-background-gray: #f3f3f3;
      }
      body {
        margin: 0;
      }
      #root {
        min-height: 100vh;
      }
    </style>
